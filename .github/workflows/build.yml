name: Build and publish routing

on:
  push:
    branches: [main, master]
    paths-ignore: ["dist/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: read

concurrency:
  group: routing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - name: Build fresh public snapshots and all client outputs
        run: python scripts/build.py --refresh
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Download the pinned official core
        run: python scripts/download_mihomo.py
      - name: Verify with Mihomo and inspect actual groups
        run: python scripts/verify_mihomo.py --core .cache/mihomo
      - uses: actions/upload-artifact@v7
        with:
          name: unified-routing-${{ github.sha }}
          path: |
            dist/
            .cache/mihomo-validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish only after every check passed
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: python scripts/publish.py
